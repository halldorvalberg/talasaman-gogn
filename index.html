<!doctype html>
<html lang="is">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Talasaman gögn</title>
  <link rel="stylesheet" href="style.css">
  <script>
    if (localStorage.getItem('palette') === 'mono') document.documentElement.dataset.palette = 'mono';
  </script>
</head>
<body>
  <aside id="sidebar">
    <div class="brand">
      <span class="brand-mark"></span>
      <span>Talasaman gögn</span>
    </div>
    <nav id="pages"></nav>
    <p class="sidebar-foot">
      Data: <a href="https://talasaman.is/gogn">talasaman.is</a><br>
      <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>
    </p>
  </aside>

  <div id="shell">
    <header class="topbar">
      <button id="toggle-sidebar" aria-controls="sidebar" aria-expanded="true" title="Toggle sidebar">
        <span></span><span></span><span></span>
      </button>
      <span id="crumb"></span>
      <button id="toggle-palette" title="Switch colour palette">
        <span class="palette-dots"><i></i><i></i><i></i></span>
        <span id="palette-name"></span>
      </button>
    </header>

    <main id="page"></main>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
