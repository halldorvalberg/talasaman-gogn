<!doctype html>
<html lang="is">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Talasaman gögn</title>
  <link rel="stylesheet" href="style.css">
  <script>
    document.documentElement.dataset.theme = localStorage.getItem('theme')
      ?? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  </script>
</head>
<body>
  <aside id="sidebar">
    <div class="brand">
      <span class="brand-mark"></span>
      <span>Talasaman gögn</span>
    </div>
    <nav id="pages"></nav>
    <div class="theme-toggle" role="group" aria-label="Colour theme">
      <button data-theme-choice="light" title="Light" aria-label="Light">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>
      </button>
      <button data-theme-choice="dark" title="Dark" aria-label="Dark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
      </button>
    </div>
    <p class="sidebar-foot">
      Data: <a href="https://talasaman.is/gogn">talasaman.is</a><br>
      <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>
    </p>
  </aside>

  <div id="shell">
    <header class="topbar">
      <button id="toggle-sidebar" aria-controls="sidebar" aria-expanded="true" title="Toggle sidebar">
        <span></span><span></span><span></span>
      </button>
      <span id="crumb"></span>
    </header>

    <main id="page"></main>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
